<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Insert Coin Lunar</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* melhor experiência em touch, sem arrastar textos */
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0a0c1a, #020308);
            font-family: 'Inter', sans-serif;
            color: #eef5ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* efeito lunar / estrelas */
        .cosmic-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(1px 1px at 15px 40px, #fff6d0, rgba(0,0,0,0)),
                              radial-gradient(1.5px 1.5px at 120px 210px, #ffdd99, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 180px 180px, 240px 240px;
            opacity: 0.25;
        }

        .moon-glow {
            position: fixed;
            top: -15%;
            right: -8%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,210,100,0.2) 0%, rgba(8,12,25,0) 70%);
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }

        /* container principal */
        .app {
            position: relative;
            z-index: 2;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 24px 30px;
        }

        /* barra superior: logo, search, user */
        .top-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            background: rgba(6, 9, 20, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 60px;
            padding: 12px 28px;
            border: 1px solid rgba(255, 200, 100, 0.35);
            margin-bottom: 32px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .logo i {
            font-size: 2.2rem;
            color: #ffcd7e;
            filter: drop-shadow(0 0 4px #ffaa33);
        }
        .logo h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 1.7rem;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .search-area {
            flex: 1;
            max-width: 380px;
            position: relative;
        }
        .search-area i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffbc6e;
            font-size: 1.1rem;
        }
        #searchInput {
            width: 100%;
            padding: 12px 18px 12px 46px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255,200,100,0.6);
            border-radius: 50px;
            font-size: 0.95rem;
            color: #fff3e0;
            font-weight: 500;
            transition: 0.2s;
        }
        #searchInput:focus {
            outline: none;
            border-color: #ffbc5e;
            box-shadow: 0 0 10px #ffb34780;
            background: #0c1020;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(0,0,0,0.4);
            padding: 6px 20px 6px 18px;
            border-radius: 60px;
        }
        .user-greeting {
            font-weight: 600;
            background: #ffbc6e20;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            border-left: 2px solid #ffbc5e;
        }
        .user-greeting i {
            margin-right: 8px;
            color: #ffcd7e;
        }
        button {
            background: linear-gradient(145deg, #2a2f44, #1a1e32);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffdfb3;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            border: 1px solid #ffbc6e60;
        }
        button:hover {
            background: #ffbc6e;
            color: #0b0e1a;
            border-color: #fff0cf;
            transform: scale(0.96);
        }

        /* gamepad status */
        .gamepad-status {
            background: #0a0e1c80;
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 0.7rem;
            font-family: monospace;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* layout: sidebar + main */
        .dashboard {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        /* sidebar consoles */
        .console-sidebar {
            width: 270px;
            background: rgba(8, 12, 25, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(255, 210, 90, 0.3);
            padding: 22px 16px;
            height: fit-content;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px dashed #ffbc6e60;
            padding-bottom: 14px;
        }
        .sidebar-header i {
            font-size: 2rem;
            color: #ffcd7e;
        }
        .sidebar-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
        }
        .console-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .console-btn {
            background: rgba(20, 26, 48, 0.7);
            border: 1px solid rgba(255,200,100,0.3);
            border-radius: 60px;
            padding: 12px 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .console-btn i {
            width: 28px;
            font-size: 1.4rem;
            color: #ffcd7e;
        }
        .console-btn.active {
            background: linear-gradient(95deg, #f0b34b30, #ffbe5c40);
            border-color: #ffbc5e;
            box-shadow: 0 0 10px #ffbc6e40;
        }
        .console-btn:hover:not(.active) {
            background: #2f375b80;
            transform: translateX(5px);
        }

        /* área principal */
        .main-game-area {
            flex: 1;
            min-width: 280px;
        }

        /* banner console ativo */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: #00000030;
            padding: 12px 18px;
            border-radius: 50px;
        }
        .active-console-badge {
            font-family: 'Orbitron', monospace;
            background: #ffbc6e20;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            border: 1px solid #ffbc6e;
        }
        .fullscreen-btn {
            background: #1f253e;
            border: 1px solid #ffbc6e;
        }

        /* grid de jogos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 26px;
            margin-top: 12px;
        }
        .game-card {
            background: linear-gradient(145deg, #111827, #0a0e1c);
            border-radius: 36px;
            padding: 18px 16px 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 200, 120, 0.4);
            transition: 0.25s;
            backdrop-filter: blur(4px);
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: #ffc978;
            box-shadow: 0 20px 30px -10px black;
        }
        .game-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 12px;
            color: #ffcd7e;
        }
        .game-title {
            font-weight: 800;
            font-size: 1.35rem;
            text-align: center;
            font-family: 'Orbitron', monospace;
        }
        .game-console-tag {
            text-align: center;
            background: #2a2f4460;
            width: fit-content;
            margin: 10px auto 0;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .play-hint {
            text-align: center;
            margin-top: 14px;
            font-size: 0.7rem;
            opacity: 0.8;
        }

        /* modal de login */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #10141f;
            border-radius: 56px;
            padding: 36px 32px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #ffbc6e;
        }
        .modal-card input {
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            background: #0a0e1a;
            border: 1px solid #ffbc6e;
            color: white;
            margin: 18px 0;
        }
        .modal-card button {
            margin: 6px;
        }

        /* iframe overlay (tela de jogo) */
        .game-iframe-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #03050b;
            z-index: 2000;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-iframe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #000000aa;
            backdrop-filter: blur(10px);
            border-radius: 60px;
            margin-bottom: 18px;
        }
        .game-iframe-header h3 {
            font-family: 'Orbitron', monospace;
        }
        .close-iframe {
            background: #ff4d4d;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .iframe-container {
            flex: 1;
            width: 100%;
            background: black;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 0 40px #ffbc6e30;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 780px) {
            .app {
                padding: 16px;
            }
            .console-sidebar {
                width: 100%;
            }
            .console-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .console-btn {
                flex: 1;
                justify-content: center;
            }
            .top-header {
                border-radius: 40px;
            }
        }
        @media (max-width: 550px) {
            .game-title {
                font-size: 1.1rem;
            }
        }
        footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.7rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="moon-glow"></div>

<div class="app">
    <div class="top-header">
        <div class="logo">
            <i class="fas fa-coin"></i>
            <h1>INSERT COIN LUNAR</h1>
        </div>
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar jogo... Mario, Slug, Pokemon...">
        </div>
        <div class="user-panel">
            <div class="user-greeting" id="greetingBlock">
                <i class="fas fa-user-astronaut"></i> <span id="usernameDisplay">Visitante</span>
            </div>
            <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <button id="logoutBtn" style="display: none;"><i class="fas fa-sign-out-alt"></i> Sair</button>
            <div class="gamepad-status" id="gamepadStatus">
                <i class="fas fa-gamepad"></i> <span id="gamepadText">desconectado</span>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <!-- Sidebar consoles -->
        <aside class="console-sidebar">
            <div class="sidebar-header">
                <i class="fas fa-cubes"></i>
                <h2>CONSOLES</h2>
            </div>
            <div class="console-list" id="consoleList"></div>
            <div style="margin-top: 28px; text-align: center; font-size: 11px;">
                <i class="fas fa-moon"></i> lunar arcade
            </div>
        </aside>

        <!-- main content: games grid -->
        <div class="main-game-area">
            <div class="info-bar">
                <div class="active-console-badge" id="activeConsoleBadge">TODOS OS JOGOS</div>
                <button id="fullscreenGridBtn" class="fullscreen-btn"><i class="fas fa-expand"></i> Tela cheia</button>
            </div>
            <div class="games-grid" id="gamesGrid">
                <!-- jogos via js -->
            </div>
            <footer>
                <i class="fas fa-gamepad"></i> Conecte um controle Gamepad — suporte nativo · Modo tela cheia · Jogue com estilo
            </footer>
        </div>
    </div>
</div>

<!-- Modal de login -->
<div id="loginModal" class="modal">
    <div class="modal-card">
        <i class="fas fa-moon" style="font-size: 48px; color:#ffbc6e;"></i>
        <h3>Entrar na Lunar</h3>
        <input type="text" id="playerName" placeholder="Seu nick" maxlength="18">
        <button id="confirmLogin"><i class="fas fa-check"></i> Iniciar sessão</button>
        <button id="closeModalBtn" class="close-modal">Fechar</button>
    </div>
</div>

<!-- Iframe overlay para jogar em tela cheia / integrado -->
<div id="gameIframeOverlay" class="game-iframe-overlay">
    <div class="game-iframe-header">
        <h3 id="iframeGameTitle"><i class="fas fa-gamepad"></i> JOGANDO</h3>
        <button id="closeIframeBtn" class="close-iframe"><i class="fas fa-times"></i> Fechar jogo</button>
    </div>
    <div class="iframe-container" id="iframeContainer">
        <iframe id="gameIframe" allowfullscreen></iframe>
    </div>
</div>

<script>
    // ---------- JOGOS EXATOS (somente os 4) ----------
    const GAMES = [
        {
            id: 1,
            title: "Super Mario World",
            console: "SNES",
            icon: "fa-mushroom",
            embedUrl: "https://classicjoy.games/embed?slug=super-mario-world",
            slug: "super-mario-world"
        },
        {
            id: 2,
            title: "Metal Slug",
            console: "Neo Geo",
            icon: "fa-bomb",
            embedUrl: "https://classicjoy.games/embed?slug=metal-slug",
            slug: "metal-slug"
        },
        {
            id: 3,
            title: "Pokémon Fire Red",
            console: "Game Boy Advance",
            icon: "fa-paw",
            embedUrl: "https://classicjoy.games/embed?slug=pokemon-fire-red-version-v1-1",
            slug: "pokemon-fire-red"
        },
        {
            id: 4,
            title: "Donkey Kong Country",
            console: "SNES",
            icon: "fa-apple-alt",
            embedUrl: "https://classicjoy.games/embed?slug=donkey-kong-country",
            slug: "donkey-kong-country"
        }
    ];

    // consoles únicos (ordenados)
    const allConsoles = ["Todos", "SNES", "Neo Geo", "Game Boy Advance"];

    let currentUser = null;
    let selectedConsole = "Todos";
    let searchTerm = "";

    // DOM elements
    const gamesGrid = document.getElementById('gamesGrid');
    const searchInput = document.getElementById('searchInput');
    const consoleListDiv = document.getElementById('consoleList');
    const activeConsoleBadge = document.getElementById('activeConsoleBadge');
    const usernameSpan = document.getElementById('usernameDisplay');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginModal = document.getElementById('loginModal');
    const playerNameInput = document.getElementById('playerName');
    const confirmLogin = document.getElementById('confirmLogin');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const fullscreenBtn = document.getElementById('fullscreenGridBtn');

    // iframe overlay
    const iframeOverlay = document.getElementById('gameIframeOverlay');
    const gameIframe = document.getElementById('gameIframe');
    const closeIframeBtn = document.getElementById('closeIframeBtn');
    const iframeGameTitleSpan = document.getElementById('iframeGameTitle');

    // ========== GAMEPAD DETECTION ==========
    let gamepadConnected = false;
    function updateGamepadStatus() {
        const gamepads = navigator.getGamepads();
        let connected = false;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].connected) {
                connected = true;
                break;
            }
        }
        const gamepadTextSpan = document.getElementById('gamepadText');
        if (connected) {
            gamepadTextSpan.innerText = "conectado ✓";
            gamepadTextSpan.style.color = "#ffbc6e";
        } else {
            gamepadTextSpan.innerText = "desconectado";
            gamepadTextSpan.style.color = "#aaa";
        }
        requestAnimationFrame(() => updateGamepadStatus());
    }
    window.addEventListener("gamepadconnected", (e) => { console.log("Gamepad conectado"); updateGamepadStatus(); });
    window.addEventListener("gamepaddisconnected", () => { updateGamepadStatus(); });
    updateGamepadStatus();

    // ========== FUNÇÕES DE FILTRO ==========
    function getFilteredGames() {
        let filtered = [...GAMES];
        if (selectedConsole !== "Todos") {
            filtered = filtered.filter(g => g.console === selectedConsole);
        }
        if (searchTerm.trim() !== "") {
            const term = searchTerm.trim().toLowerCase();
            filtered = filtered.filter(g => g.title.toLowerCase().includes(term));
        }
        return filtered;
    }

    function renderGames() {
        const filtered = getFilteredGames();
        if (filtered.length === 0) {
            gamesGrid.innerHTML = `<div class="no-results" style="grid-column:1/-1; text-align:center; padding:60px;"><i class="fas fa-meteor"></i> Nenhum jogo encontrado... <br>insira mais créditos ou troque de console</div>`;
            return;
        }
        gamesGrid.innerHTML = filtered.map(game => `
            <div class="game-card" data-game='${JSON.stringify(game)}'>
                <div class="game-icon"><i class="fas ${game.icon}"></i></div>
                <div class="game-title">${escapeHtml(game.title)}</div>
                <div style="text-align:center;"><span class="game-console-tag"><i class="fas fa-cube"></i> ${game.console}</span></div>
                <div class="play-hint"><i class="fas fa-play-circle"></i> JOGAR AGORA</div>
            </div>
        `).join('');

        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const game = JSON.parse(card.getAttribute('data-game'));
                openGameInFullscreen(game);
            });
        });
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // Abrir jogo em iframe fullscreen com detecção de controle
    function openGameInFullscreen(game) {
        if (!currentUser) {
            // guarda o jogo pendente para abrir após login
            window.pendingGame = game;
            openLoginModal();
            return;
        }
        // define iframe
        gameIframe.src = game.embedUrl;
        iframeGameTitleSpan.innerHTML = `<i class="fas fa-gamepad"></i> ${escapeHtml(game.title)} - Lunar Arcade`;
        iframeOverlay.style.display = 'flex';
        // Dica visual de crédito
        showToast(`🪙 ${currentUser.name} inseriu crédito em ${game.title}! Controle detectado: ${gamepadConnected ? "sim" : "teclado/touch"}`);
    }

    function closeGameIframe() {
        gameIframe.src = ""; // para parar carregamento
        iframeOverlay.style.display = "none";
    }

    // Função toast simples
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '20px';
        toast.style.backgroundColor = '#ffbc6e';
        toast.style.color = '#0a0c1a';
        toast.style.padding = '12px 22px';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '3000';
        toast.style.fontFamily = 'monospace';
        toast.style.boxShadow = '0 0 15px gold';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // renderizar consoles
    function renderConsoles() {
        consoleListDiv.innerHTML = '';
        allConsoles.forEach(consoleName => {
            const btn = document.createElement('div');
            btn.className = `console-btn ${selectedConsole === consoleName ? 'active' : ''}`;
            let icon = "fa-tv";
            if (consoleName === "SNES") icon = "fa-microchip";
            else if (consoleName === "Neo Geo") icon = "fa-arcade";
            else if (consoleName === "Game Boy Advance") icon = "fa-gameboy";
            else icon = "fa-globe";
            btn.innerHTML = `<i class="fas ${icon}"></i><span>${consoleName}</span>`;
            btn.addEventListener('click', () => {
                selectedConsole = consoleName;
                renderConsoles();
                updateBadge();
                renderGames();
            });
            consoleListDiv.appendChild(btn);
        });
    }

    function updateBadge() {
        activeConsoleBadge.innerText = selectedConsole === "Todos" ? "TODOS OS CONSOLES" : `CONSOLE: ${selectedConsole}`;
    }

    // login modal logic
    function openLoginModal() {
        playerNameInput.value = currentUser ? currentUser.name : "";
        loginModal.style.display = 'flex';
    }
    function closeLoginModalFunc() {
        loginModal.style.display = 'none';
    }
    function performLogin() {
        let name = playerNameInput.value.trim();
        if (name === "") name = "LunarFighter";
        if (name.length > 18) name = name.substring(0,18);
        currentUser = { name: escapeHtml(name) };
        updateUserUI();
        closeLoginModalFunc();
        if (window.pendingGame) {
            const gameToOpen = window.pendingGame;
            window.pendingGame = null;
            openGameInFullscreen(gameToOpen);
        } else {
            showToast(`✨ Bem-vindo(a) ${currentUser.name}! A lua te espera. ✨`);
        }
    }
    function logout() {
        currentUser = null;
        updateUserUI();
        showToast(`👾 Até logo, visitante! Volte para mais créditos.`);
        window.pendingGame = null;
    }
    function updateUserUI() {
        if (currentUser) {
            usernameSpan.innerText = currentUser.name;
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-flex';
            document.getElementById('greetingBlock').innerHTML = `<i class="fas fa-user-check"></i> <span id="usernameDisplay">${currentUser.name}</span>`;
        } else {
            usernameSpan.innerText = "Visitante";
            loginBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'none';
            document.getElementById('greetingBlock').innerHTML = `<i class="fas fa-user-astronaut"></i> <span id="usernameDisplay">Visitante</span>`;
        }
    }

    // fullscreen na grade (tela cheia do elemento principal)
    function requestFullscreen(element) {
        if (element.requestFullscreen) element.requestFullscreen();
        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
        else if (element.msRequestFullscreen) element.msRequestFullscreen();
    }
    fullscreenBtn.addEventListener('click', () => {
        const mainArea = document.querySelector('.main-game-area');
        requestFullscreen(mainArea);
    });

    // Fechar iframe com ESC também
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && iframeOverlay.style.display === 'flex') {
            closeGameIframe();
        }
    });

    // Event listeners
    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderGames();
    });
    loginBtn.addEventListener('click', openLoginModal);
    logoutBtn.addEventListener('click', logout);
    confirmLogin.addEventListener('click', performLogin);
    closeModalBtn.addEventListener('click', closeLoginModalFunc);
    closeIframeBtn.addEventListener('click', closeGameIframe);
    window.addEventListener('click', (e) => { if (e.target === loginModal) closeLoginModalFunc(); });

    // inicializar
    function init() {
        renderConsoles();
        updateBadge();
        renderGames();
        updateUserUI();
        currentUser = null;
        updateUserUI();
        window.pendingGame = null;
        // Suporte a orientação e redimensionamento
        window.addEventListener('resize', () => {});
    }
    init();
</script>
</body>
</html>
